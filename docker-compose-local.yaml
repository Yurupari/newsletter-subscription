services:
  postgres:
    image: postgres:17-trixie
    container_name: newsletter-subscription-postgres
    restart: always
    environment:
      - POSTGRES_DB=newsletter_subscription
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/postgresql
      - db-logs:/var/log/postgresql

  keycloak-db:
    image: postgres:17-trixie
    container_name: newsletter-subscription-keycloak-postgres
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    volumes:
      - ./volume-data/postgresql_keycloak_data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: newsletter-subscription-keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8091:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-db

  user-service:
    build:
      context: .
      dockerfile: ./user-service/src/main/docker/Dockerfile
    container_name: newsletter-subscription-user-service
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=newsletter_subscription
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - ENCRYPTION_SECRET_KEY=SkC9PBmRbSgm2ueOwQnTF+SCaDbVNeV+3eqCtpMA4ks=
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ns-security-realm
      - KEYCLOAK_CLIENT_ID=newsletter-subscription-client
      - KEYCLOAK_CLIENT_SECRET=tTX4z0YqQEkAdJFtkuvoFob2f2Tsybyz
    volumes:
      - ./logs/:/logs
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - keycloak

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/src/main/docker/Dockerfile
    container_name: newsletter-subscription-api-gateway
    environment:
      - USER_SERVICE_URL=http://user-service:8080
      - NEWSLETTER_SERVICE_URL=http://newsletter-service:8081
      - JWT_SET_URI=http://keycloak:8080/realms/ns-security-realm/protocol/openid-connect/certs
      - ISSUER_URI=http://keycloak:8080/realms/ns-security-realm
    volumes:
      - ./logs/:/logs
    ports:
      - "9000:9000"
    depends_on:
      - keycloak

volumes:
  db-data:
  db-logs:
