spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: user-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: registerUserEvent:com.yurupari.user_service.kafka.event.RegisterUserEvent,deleteUserEvent:com.yurupari.user_service.kafka.event.DeleteUserEvent
        spring.json.trusted.packages: com.yurupari.*
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: registerUserEvent:com.yurupari.user_service.kafka.event.RegisterUserEvent,deleteUserEvent:com.yurupari.user_service.kafka.event.DeleteUserEvent

encryption:
  algorithm: AES/GCM/NoPadding
  algorithm-instance: AES
  tag-length-bit: 128
  iv-length-byte: 12
  secret-key: 9AbaURDkvCF7djbkCfNNcv/an7OwXV/0t7kB6X0OQok=

keycloak:
  auth-server-url: http://localhost:9090
  realm: test-realm
  credential: test-client-id:test-client-secret