server:
  port: 9000

spring:
  application:
    name: api-gateway

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_SET_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}

services:
  items:
    user-service:
      url: ${USER_SERVICE_URL}
      path: /api/v1/user/**
      circuitBreakerId: userServiceCircuitBreaker
      fallbackPath: /fallback/user
      fallbackMessage: "User Service is currently unavailable"

    newsletter-service:
      url: ${NEWSLETTER_SERVICE_URL}
      path: /api/v1/newsletter/**
      circuitBreakerId: newsletterServiceCircuitBreaker
      fallbackPath: /fallback/newsletter
      fallbackMessage: "Newsletter Service is currently unavailable"

security:
  excluded:
    urls: /actuator/**, /api/v1/user/register/**, /api/v1/user/auth/login/**, /api/v1/subscription/confirm/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        minimum-number-of-calls: 5
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

keycloak:
  auth:
    jwt-set-uri: ${JWT_SET_URI}