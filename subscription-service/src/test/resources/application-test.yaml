spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    template:
      default-topic: confirm-subscription
    topics:
      confirm-subscription: confirm-subscription
      unsubscribe: unsubscribe
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: confirmSubscriptionEvent:com.yurupari.common_data.kafka.event.ConfirmSubscriptionEvent,cpdEvent:com.yurupari.common_data.kafka.event.CPDEvent

services:
  user-service:
    url: http://localhost:8080

token:
  valid-time: 3600

templates:
  base-path: /templates/
  files:
    NEWSLETTER_SUBSCRIBED: subscription_properties.txt
    NEWSLETTER_UNSUBSCRIBED: unsubscription_properties.txt
