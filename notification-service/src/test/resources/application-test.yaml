spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    template:
      default-topic: confirm-subscription
    topics:
      confirm-subscription: confirm-subscription
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: confirmSubscriptionEvent:com.yurupari.common_data.kafka.event.ConfirmSubscriptionEvent
        spring.json.trusted.packages: com.yurupari.*
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: confirmSubscriptionEvent:com.yurupari.common_data.kafka.event.ConfirmSubscriptionEvent

  mail:
    host: localhost
    port: 3025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

services:
  user-service:
    url: http://localhost:8080

email:
  service:
    url: http://localhost:8443
  from: noreply@yurupari.com
  confirmation-subscription:
    subject: Confirm Subscription
    link-prefix: http://localhost:8081/api/v1/subscription/confirm/
